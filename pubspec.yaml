name: euroside
description: "SiteFlow Project."

publish_to: "none" # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.9.2


dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  image_picker: ^0.8.7+4
  shared_preferences: ^2.2.2
  http: ^1.2.0
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  path_provider: ^2.1.5
  path_provider_android: ^2.2.15
  google_fonts: ^6.2.1

  # Riverpod (Matching versions)
  flutter_riverpod: ^2.6.1
  riverpod: ^2.6.1
  geolocator: ^9.0.2
  url_launcher: ^6.2.5
  iconsax: ^0.0.8
  fluttertoast: ^8.2.4
  oktoast: ^3.0.0
  permission_handler: ^11.3.1
  webview_flutter: ^4.7.0
  webview_flutter_android: ^3.16.3
  webview_flutter_wkwebview: ^3.14.0
  flutter_animate: ^4.5.0
  camera: ^0.11.0+1
  photo_view: ^0.15.0
  camera_android_camerax: ^0.6.7
  firebase_core: ^2.14.0
  firebase_messaging: ^14.4.0
  dio: ^5.4.0
  geocoding: ^3.0.0
  flutter_inappwebview: ^6.0.0
  file_picker: ^8.0.5
  intl: ^0.19.0
  syncfusion_flutter_pdfviewer: ^28.2.7
  flutter_local_notifications: ^20.1.0
  dropdown_button2: 3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/2.png"

flutter:
  
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/logo/
    - assets/form/
    - assets/logo/2.png
    - assets/logo/3.png
    - assets/logo/hero.png
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
